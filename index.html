<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arena Showdown - GitHub Edition</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-container">
    <!-- UI Header -->
    <div id="ui-panel">
      <div>Level: <span id="level-txt">1</span></div>
      <div>Waktu: <span id="time-txt">30</span>s</div>
      <div>P1 Skor: <span id="p1-score">0</span></div>
      <div>P2/CPU Skor: <span id="p2-score">0</span></div>
    </div>

    <!-- Canvas Utama -->
    <canvas id="gameCanvas" width="800" height="500"></canvas>

    <!-- Overlay Menu / Game Over -->
    <div id="overlay" class="overlay">
      <h1 id="menu-title">ARENA SHOWDOWN</h1>
      <p id="menu-subtitle">Pilih Mode Permainan:</p>
      <div class="btn-group">
        <button id="btn-single">1 Player (vs Computer)</button>
        <button id="btn-multi">2 Players (Lokal)</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
